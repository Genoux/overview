# Created by jb-toolkit; owned by the project. Tag-driven (R4.3): push vX.Y.Z
# and this verifies, checks, builds and drafts a release. Publishing the draft
# is the owner's decision.
#
# Targets are the owner's own machines: macOS (Apple silicon) and Linux on a
# Wayland compositor. The Linux build ships one AppImage, which runs on any
# distro; the Ubuntu runner is only the machine that builds it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # A release whose manifest disagrees with its tag reports a version
      # nobody built.
      - name: Version matches the tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          found=$(.toolkit/version)
          if [ "$found" != "$expected" ]; then
            echo "manifest says $found, tag says $expected" >&2
            exit 1
          fi

      # Tauri compiles against WebKitGTK on Linux.
      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # A tag can point at a commit CI never saw.
      - name: Check
        run: scripts/check

      - name: Build
        run: scripts/build

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--draft --generate-notes --verify-tag"
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease" ;; esac
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" $flags --title "$GITHUB_REF_NAME" dist/*
