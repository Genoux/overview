[package]
name = "overview-core"
version = "0.0.1"
edition = "2021"
description = "Reads coding-agent sessions (Claude Code, Codex, ...) from disk into one normalized shape. Read-only."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "overview-probe"
path = "src/bin/probe.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
