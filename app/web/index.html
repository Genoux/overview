<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="vendor/signal/signal.css">
<link rel="stylesheet" href="vendor/signal/components.css">
<link rel="stylesheet" href="vendor/signal/overview.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="title">
    <div class="mark"><svg class="sg-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1 11 3.5 6 6 1 3.5Z" fill="none" stroke="currentColor"/><path d="M1 6.5 6 9 11 6.5" fill="none" stroke="var(--sg-text-disabled)"/></svg>overview</div>
    <div class="crumb"><b>today</b><span class="long" id="crumb-n"></span></div>
    <div class="tright"><span class="clock" id="clock"></span><span class="sg-tag">sample data</span><button class="sg-btn sg-btn--ghost" id="demo" type="button" aria-pressed="true">live demo <span class="sg-switch" aria-hidden="true"></span></button><button class="sg-btn sg-btn--ghost sg-btn--icon" id="settings-btn" type="button" aria-label="Settings" title="Settings"><svg class="sg-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 3.5h8M2 8.5h8" stroke="currentColor" stroke-width="1.2"/><circle cx="4.5" cy="3.5" r="1.4" fill="var(--sg-surface-base)" stroke="currentColor" stroke-width="1.2"/><circle cx="7.5" cy="8.5" r="1.4" fill="var(--sg-surface-base)" stroke="currentColor" stroke-width="1.2"/></svg></button></div>
  </header>

  <section class="stage" id="stage" tabindex="0" aria-label="Map of agent sessions. Drag to pan, scroll to zoom, click a machine, a project or the hub for details, Tab to visit agents that need you, Enter to open the selected one.">
    <canvas id="cv" aria-hidden="true"></canvas>
    <div class="ov ov-zoom sg-segmented" role="group" aria-label="Map controls">
      <button type="button" id="zout" aria-label="Zoom out"><svg class="sg-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6h7" stroke="currentColor" stroke-width="1.3"/></svg></button>
      <output id="zval" aria-live="polite">1×</output>
      <button type="button" id="zin" aria-label="Zoom in"><svg class="sg-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6h7M6 2.5v7" stroke="currentColor" stroke-width="1.3"/></svg></button>
      <button type="button" id="zfit">fit</button>
      <button type="button" id="help" aria-expanded="false" aria-label="Legend and keys">?</button>
    </div>
    <div class="ov ov-minimap sg-minimap" aria-label="Minimap"><div class="sg-minimap__head"><span>minimap</span><span id="mcount"></span></div><canvas id="mm" width="352" height="216"></canvas></div>
    <div id="edges"></div>
    <aside class="ov ov-info sg-popover" id="info" aria-live="polite" hidden></aside>
    <div class="tip sg-tooltip" id="tip" hidden></div>
  </section>

  <aside class="rail" aria-label="Attention and tasks">
    <div class="sg-tabs" role="tablist">
      <button class="sg-tab" role="tab" id="t-brief" aria-selected="true" type="button">today</button>
      <button class="sg-tab" role="tab" id="t-proj" aria-selected="false" type="button">projects</button>
      <button class="sg-tab" role="tab" id="t-tasks" aria-selected="false" type="button">tasks <span class="sg-tab__count" id="tcount"></span></button>
    </div>
    <div id="v-now" style="display:none;flex-direction:column;min-height:0;flex:1">
      <div class="chips" id="chips" role="group" aria-label="Filter by state"></div>
      <div class="rbody" id="p-now"></div>
    </div>
    <div class="rbody today tasks" id="p-tasks" hidden></div>
    <div class="rbody today" id="p-brief"></div>
    <div class="rbody today" id="p-proj" hidden></div>
  </aside>

  <footer class="sg-statusbar" id="status"></footer>
</div>
<section class="settings" id="settings" role="dialog" aria-modal="true" aria-label="Settings" hidden></section>
<div class="toast sg-toast is-hidden" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/ui.js"></script>
</body>
</html>
