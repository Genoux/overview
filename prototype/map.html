<style>
/* Layout: title bar, measured isometric stage + attention rail, status bar. Signal graphite, colour only for status and "you". */
:root {
  --ground: #1b1c1e;
  --bg: #202123;
  --panel: #262729;
  --side: #1a1b1c;
  --line: #303133;
  --line2: #424345;
  --strong: #77787a;
  --sel: #2e2e30;
  --fg: #e9e9eb;
  --dim: #abacae;
  --subtle: #9b9c9e;
  --faint: #727375;
  --accent: #888ff7;
  --wait: #fec04a;
  --done: #86c2a2;
  --err: #f26b59;
  --run: #cad0d7;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, "DejaVu Sans Mono", monospace;
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Cantarell, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; background: var(--bg); color: var(--fg); }
body { font-family: var(--sans); font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
* { box-sizing: border-box; }
::selection { background: rgb(136 143 247 / 0.3); }
* { scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--faint); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 3px; }
.mono { font-family: var(--mono); }
kbd { font-family: var(--mono); font-size: 11px; color: var(--dim); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; line-height: 16px; display: inline-block; min-width: 18px; text-align: center; background: var(--side); }
svg.i { width: 12px; height: 12px; flex: none; display: inline-block; vertical-align: -1px; }

.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: 40px minmax(0, 1fr) 24px; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }

/* title bar */
.title { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; border-bottom: 1px solid var(--line); background: var(--bg); padding-inline: max(12px, env(safe-area-inset-left, 0px)) max(12px, env(safe-area-inset-right, 0px)); gap: 12px; }
.mark { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; color: var(--fg); }
.crumb { font-family: var(--mono); font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb b { color: var(--fg); font-weight: 500; }
.tright { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
.tag { font-family: var(--mono); font-size: 11px; color: var(--subtle); border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px; white-space: nowrap; }
.tbtn { font-family: var(--mono); font-size: 12px; color: var(--dim); height: 24px; padding: 0 8px; border-radius: 5px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: background-color 80ms, color 80ms; }
.tbtn:hover { background: rgb(233 233 235 / 0.06); color: var(--fg); }
.tbtn .sw { width: 22px; height: 12px; border-radius: 6px; background: var(--line2); position: relative; transition: background-color 140ms; }
.tbtn .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); transition: transform 140ms; }
.tbtn[aria-pressed="true"] .sw { background: rgb(136 143 247 / 0.5); }
.tbtn[aria-pressed="true"] .sw::after { transform: translateX(10px); background: var(--fg); }

/* stage */
.stage { position: relative; background: var(--ground); overflow: hidden; min-width: 0; outline: none; touch-action: none; cursor: grab; }
.stage.panning { cursor: grabbing; }
.stage.over-agent { cursor: pointer; }
.stage.over-handle { cursor: move; }
.stage:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); outline: none; border-radius: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ov { position: absolute; z-index: 2; }
.zoom { top: 12px; right: 12px; display: flex; border: 1px solid var(--line2); border-radius: 5px; background: var(--panel); overflow: hidden; }
.zoom button { height: 28px; min-width: 28px; padding: 0 8px; font-family: var(--mono); font-size: 12px; color: var(--dim); display: inline-flex; align-items: center; justify-content: center; transition: background-color 80ms, color 80ms; }
.zoom button + button, .zoom output + button, .zoom button + output { border-left: 1px solid var(--line); }
.zoom button:hover { background: rgb(233 233 235 / 0.06); color: var(--fg); }
.zoom output { height: 28px; min-width: 46px; display: inline-flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 12px; color: var(--fg); font-variant-numeric: tabular-nums; border-left: 1px solid var(--line); }
.mini { left: 12px; bottom: 12px; width: 176px; border: 1px solid var(--line2); border-radius: 5px; background: rgb(26 27 28 / 0.9); overflow: hidden; }
.mini canvas { display: block; width: 176px; height: 108px; cursor: crosshair; }
.mini .mh { display: flex; gap: 8px; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--subtle); padding: 3px 8px; border-bottom: 1px solid var(--line); }
.readout { right: 12px; bottom: 12px; display: flex; align-items: center; gap: 14px; font-family: var(--mono); font-size: 11px; color: var(--subtle); background: rgb(26 27 28 / 0.85); border: 1px solid var(--line); border-radius: 5px; padding: 5px 9px; font-variant-numeric: tabular-nums; }
.readout b { color: var(--fg); font-weight: 400; }
.readout svg { display: block; overflow: visible; }
.edge { z-index: 3; position: absolute; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px 0 6px; border-radius: 5px; background: var(--panel); border: 1px solid rgb(254 192 74 / 0.45); font-family: var(--mono); font-size: 11px; color: var(--fg); transform: translate(-50%, -50%); white-space: nowrap; transition: background-color 80ms; }
.edge:hover { background: #2f2c25; }
.edge .ar { width: 10px; height: 10px; display: inline-block; }
.edge span { color: var(--wait); }
.tip { z-index: 4; position: absolute; pointer-events: none; transform: translate(-50%, calc(-100% - 14px)); background: var(--panel); border: 1px solid var(--line2); border-radius: 5px; padding: 7px 9px; max-width: 280px; width: max-content; box-shadow: 0 6px 18px rgb(0 0 0 / 0.5); }
.tip .t { font-size: 13px; font-weight: 500; }
.tip .s { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-top: 2px; display: flex; gap: 6px; align-items: center; }
.tip .c { font-family: var(--mono); font-size: 12px; color: var(--fg); margin-top: 5px; }

/* rail */
.rail { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tabs { display: flex; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--line); height: 32px; flex: none; }
.tabs button { font-family: var(--mono); font-size: 12px; color: var(--subtle); position: relative; height: 32px; }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--fg); }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--fg); }
.rbody { overflow-y: auto; padding: 4px 12px 16px; flex: 1; min-height: 0; }
.sh { font-family: var(--mono); font-size: 11px; color: var(--subtle); letter-spacing: 0.06em; text-transform: uppercase; margin: 16px 4px 8px; display: flex; justify-content: space-between; }
.card { border: 1px solid rgb(254 192 74 / 0.4); background: rgb(254 192 74 / 0.06); border-radius: 6px; padding: 10px 12px; display: grid; gap: 6px; margin-bottom: 8px; cursor: pointer; }
.card.sel { box-shadow: 0 0 0 2px var(--accent); border-color: transparent; }
.card .ct { font-size: 14px; font-weight: 500; text-wrap: balance; }
.card .cm { font-family: var(--mono); font-size: 11px; color: var(--subtle); }
.card .cs { display: flex; align-items: baseline; gap: 6px; font-family: var(--mono); font-size: 12px; color: var(--wait); }
.card .cs svg { align-self: center; }
.card .cs span { min-width: 0; flex: 1; }
.card .cs em { font-style: normal; color: var(--subtle); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.card .cmd { font-family: var(--mono); font-size: 12.5px; color: var(--fg); overflow-wrap: anywhere; }
.card .cmd i { color: var(--faint); font-style: normal; }
.card .q { font-size: 13px; color: var(--fg); }
.card .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.btn { height: 26px; display: inline-flex; align-items: center; gap: 7px; padding: 0 8px 0 4px; border: 1px solid var(--line2); border-radius: 5px; font-family: var(--mono); font-size: 12px; color: var(--fg); background: var(--side); transition: background-color 80ms, border-color 80ms; }
.btn:hover { border-color: var(--strong); }
.btn.pri { border-color: rgb(136 143 247 / 0.6); background: rgb(136 143 247 / 0.12); }
.btn.pri:hover { background: rgb(136 143 247 / 0.2); }
.row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; column-gap: 8px; row-gap: 1px; align-items: baseline; padding: 6px 4px; border-radius: 5px; cursor: pointer; }
.row:hover { background: rgb(233 233 235 / 0.04); }
.row.sel { background: var(--sel); box-shadow: inset 0 0 0 1px rgb(136 143 247 / 0.6); }
.row .rt { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .ra { font-family: var(--mono); font-size: 11px; color: var(--subtle); font-variant-numeric: tabular-nums; }
.row .rs { grid-column: 2 / 4; font-family: var(--mono); font-size: 11px; color: var(--subtle); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row svg.i { align-self: center; }
.row.err .rs { color: var(--err); }
details > summary { list-style: none; cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }
details > summary .sh::after { content: "show"; text-transform: none; letter-spacing: 0; }
details[open] > summary .sh::after { content: "hide"; }
.legend { flex: none; border-top: 1px solid var(--line); padding: 10px 16px 12px; display: grid; gap: 3px; font-family: var(--mono); font-size: 11px; color: var(--subtle); }
.legend div { display: flex; align-items: center; gap: 8px; }
.brief h2 { font-size: 15px; font-weight: 500; margin: 14px 4px 2px; text-wrap: balance; }
.brief .by { font-family: var(--mono); font-size: 11px; color: var(--subtle); margin: 0 4px; }
.brief ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.bi { width: 100%; text-align: left; display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 2px 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--side); }
.bi:hover { border-color: var(--line2); }
.bi .n { font-family: var(--mono); font-size: 12px; color: var(--wait); }
.bi .bt { font-size: 13px; font-weight: 500; }
.bi .bs { grid-column: 2; font-size: 12.5px; color: var(--dim); }

/* status bar */
.status { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; border-top: 1px solid var(--line); background: var(--bg); font-family: var(--mono); font-size: 11.5px; color: var(--dim); padding-inline: max(12px, env(safe-area-inset-left, 0px)) max(12px, env(safe-area-inset-right, 0px)); white-space: nowrap; overflow: hidden; }
.status .brand { color: var(--accent); }
.status .c { display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
.status .keys { margin-inline: auto; color: var(--subtle); overflow: hidden; text-overflow: ellipsis; }
.status .hosts { display: inline-flex; gap: 12px; }
.status .hosts span { display: inline-flex; align-items: center; gap: 5px; }
.status .hosts span::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--done); }

.toast { position: fixed; z-index: 20; right: calc(max(12px, env(safe-area-inset-right, 0px)) + 340px); bottom: calc(env(safe-area-inset-bottom, 0px) + 36px); max-width: min(360px, calc(100% - 24px)); display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: var(--panel); border: 1px solid var(--line2); border-radius: 6px; box-shadow: 0 8px 24px rgb(0 0 0 / 0.5); font-size: 13px; transition: opacity 220ms, transform 220ms; }
.toast.off { opacity: 0; transform: translateY(8px); pointer-events: none; }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: 40px 64vh auto 24px; }
  .rail { border-left: 0; border-top: 1px solid var(--line); }
  .rbody { overflow: visible; }
  .status .keys, .status .hosts { display: none; }
  .crumb .long { display: none; }
  .tag { display: none; }
  .mini { width: 132px; }
  .mini canvas { width: 132px; height: 81px; }
  .toast { right: max(12px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="title">
    <div class="mark">
      <svg class="i" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1 11 3.5 6 6 1 3.5Z" fill="none" stroke="currentColor"/><path d="M1 6.5 6 9 11 6.5" fill="none" stroke="var(--faint)"/></svg>
      overview
    </div>
    <div class="crumb"><b>map</b><span class="long"> · 11 agents on 3 machines</span></div>

    <div class="legend" id="legend"></div>
  </aside>

  <footer class="status" id="status"></footer>
</div>
<div class="toast off" id="toast" role="status" aria-live="polite"></div>
